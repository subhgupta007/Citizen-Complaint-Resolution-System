apiVersion: v1
kind: ConfigMap
metadata:
  name: digit-ui-tl
  namespace: egov
data:
  sub_filter.conf: |
    # Inject global config JS (same as core digit-ui)
    sub_filter_once off;
    sub_filter '</head>' ' <script src=https://pgr-eks-cluster-assets-bucket.s3.ap-south-1.amazonaws.com/globalConfigsPGR.js type=text/javascript></script></head>';

    # Rewrite asset paths from /digit-ui/ → /digit-ui-tl/
    sub_filter 'src="/digit-ui/' 'src="/digit-ui-tl/';
    sub_filter 'href="/digit-ui/' 'href="/digit-ui-tl/';
