apiVersion: v1
kind: ConfigMap
metadata:
  name: digit-ui-tl
  namespace: egov
data:
  sub_filter.conf: |
    # Apply only on HTML responses, do NOT touch JS bundles
    sub_filter_once off;
    sub_filter_types text/html;

    # Inject the globalConfigs script and override the contextPath for TL UI
    sub_filter '</head>' ' <script src="https://pgr-eks-cluster-assets-bucket.s3.ap-south-1.amazonaws.com/digit-ui-tl/globalConfigsPGR.js" type="text/javascript"></script>
    <script type="text/javascript">
      (function() {
        // Force TL UI context path
        window.contextPath = "digit-ui-tl";

        // If globalConfigs is present, override only CONTEXT_PATH
        if (window.globalConfigs && typeof window.globalConfigs.getConfig === "function") {
          var originalGetConfig = window.globalConfigs.getConfig;
          window.globalConfigs.getConfig = function(key) {
            if (key === "CONTEXT_PATH") {
              return "digit-ui-tl";
            }
            return originalGetConfig(key);
          };
        }
      })();
    </script></head>';
