apiVersion: v1
kind: ConfigMap
metadata:
  name: digit-ui-tl
  namespace: egov
data:
  sub_filter.conf: |
    # Apply only on HTML responses (do NOT touch JS)
    sub_filter_once off;
    sub_filter_types text/html;

    # Inject the global config script (same as PGR for now)
    sub_filter '</head>' ' <script src="https://pgr-eks-cluster-assets-bucket.s3.ap-south-1.amazonaws.com/globalConfigsPGR.js" type="text/javascript"></script></head>';
